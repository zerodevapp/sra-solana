[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
sra_across_adapter = "8Fb9Mk2PLcpMjBxd8RWa7TUNMDL2GevMuVEzAbK7YGyU"
sra_cctp_adapter = "2bXAvxF3U4FtWAnJtcL9LDnwM7qnErf3y3m6USLRKpRw"
sra_handler = "7CChUDvMWCtqWPbtCs74CCAgvuJnyiqpgNYEocNJrno5"

[programs.mainnet]
sra_across_adapter = "8Fb9Mk2PLcpMjBxd8RWa7TUNMDL2GevMuVEzAbK7YGyU"
sra_cctp_adapter = "2bXAvxF3U4FtWAnJtcL9LDnwM7qnErf3y3m6USLRKpRw"
sra_handler = "7CChUDvMWCtqWPbtCs74CCAgvuJnyiqpgNYEocNJrno5"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
build-devnet = "anchor build --program-name sra_handler -- --features devnet && anchor build --program-name sra_across_adapter -- --features devnet && anchor build --program-name sra_cctp_adapter -- --features devnet"
build-mainnet = "anchor build"
deploy-devnet = "cp deploy/keys/*-keypair.json target/deploy/ && anchor deploy --provider.cluster devnet --provider.wallet ../../solana/fee-payer.json --program-name sra_handler && anchor deploy --provider.cluster devnet --provider.wallet ../../solana/fee-payer.json --program-name sra_across_adapter && anchor deploy --provider.cluster devnet --provider.wallet ../../solana/fee-payer.json --program-name sra_cctp_adapter"
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

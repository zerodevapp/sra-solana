[package]
name = "sra-common"
version = "0.1.0"
description = "Shared types, constants, and ABI encoding for SRA Solana programs"
edition = "2021"

[features]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
# Selects devnet network constants (Across SpokePool ID, Solana chain ID).
# Default (feature off) = mainnet, matching the Surfpool mainnet-fork test suite.
devnet = []

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"
solana-keccak-hasher = "2.2.1"
solana-sha256-hasher = "2.3.0"

[dev-dependencies]
serde_json = "1"
hex = "0.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

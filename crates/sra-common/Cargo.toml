[package]
name = "sra-common"
version = "0.1.0"
description = "Shared types, constants, and ABI encoding for SRA Solana programs"
edition = "2021"

[features]
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
solana-keccak-hasher = "2.2.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

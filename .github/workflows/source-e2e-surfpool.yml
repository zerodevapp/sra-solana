name: Source E2E Surfpool

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "Anchor.toml"
      - "rust-toolchain.toml"
      - "crates/**"
      - "programs/**"
      - "idl/**"
      - "idls/**"
      - "tests/**"
      - ".github/workflows/source-e2e-surfpool.yml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: source-e2e-surfpool-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: "3.1.11"
  ANCHOR_VERSION: "1.2.0"
  SURFPOOL_VERSION: "v1.2.0"
  NODE_VERSION: "20.18.0"
  CARGO_TERM_COLOR: always

jobs:
  source-e2e-surfpool:
    name: Source E2E (Surfpool + real Across)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The full Solana dependency tree (debug host builds + SBF toolchain +
      # restored rust-cache) runs the default runner out of disk — the linker
      # dies with SIGBUS mid-build. Drop the large preinstalled toolchains we
      # never use (~20 GB).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: source-e2e-surfpool
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install yarn deps
        run: yarn install --frozen-lockfile

      - name: Cache Solana + Anchor toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.avm
            ~/.cargo/bin/avm
            ~/.cargo/bin/anchor
          key: toolchain-solana-${{ env.SOLANA_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}-v1

      - name: Install Solana CLI
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"

      - name: Add Solana to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install avm + Anchor
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/otter-sec/anchor --tag v${ANCHOR_VERSION} avm --force
          avm install ${ANCHOR_VERSION} --from-source
          avm use ${ANCHOR_VERSION}

      - name: Generate local keypair
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase --force --silent --outfile ~/.config/solana/id.json

      - name: Install Surfpool
        env:
          VERSION: ${{ env.SURFPOOL_VERSION }}
        run: curl -sL https://run.surfpool.run/ | bash

      - name: Verify tool versions
        run: |
          surfpool --version
          solana --version
          anchor --version
          rustc --version

      - name: Build local programs
        run: NO_DNA=1 anchor build --ignore-keys --arch v0

      - name: Start Surfpool
        run: |
          echo "[surfpool-ci] Starting Surfpool; logs -> /tmp/surfpool.log"
          NO_DNA=1 surfpool start --ci --network mainnet --legacy-anchor-compatibility --airdrop-keypair-path ~/.config/solana/id.json > /tmp/surfpool.log 2>&1 &

      - name: Wait for Surfpool RPC
        run: |
          for i in $(seq 1 60); do
            echo "[surfpool-ci] Waiting for Surfpool RPC (attempt ${i}/60)"
            curl -sf http://127.0.0.1:8899 \
              -H 'content-type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"getHealth","params":[]}' >/dev/null && \
              echo "[surfpool-ci] Surfpool RPC is ready on attempt ${i}/60" && exit 0
            sleep 2
          done
          echo "[surfpool-ci] Timed out waiting for Surfpool RPC; dumping /tmp/surfpool.log"
          cat /tmp/surfpool.log
          exit 1

      - name: Install branch programs
        run: |
          authority=$(solana address)
          for program_id in 7CChUDvMWCtqWPbtCs74CCAgvuJnyiqpgNYEocNJrno5 8Fb9Mk2PLcpMjBxd8RWa7TUNMDL2GevMuVEzAbK7YGyU 2bXAvxF3U4FtWAnJtcL9LDnwM7qnErf3y3m6USLRKpRw; do
            # The rotated program IDs may not exist on mainnet (yet), so the fork
            # has nothing to take over. Seed each ID by cloning the Across
            # SpokePool program as a placeholder — the branch deploy below
            # overwrites its bytes either way.
            curl -sf http://127.0.0.1:8899 \
              -H 'content-type: application/json' \
              -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"surfnet_cloneProgramAccount\",\"params\":[\"DLv3NggMiSaef97YCkew5xKUHDh13tVGZ7tydt3ZeAru\",\"${program_id}\"]}" \
              | jq -e 'has("result")' >/dev/null
            curl -sf http://127.0.0.1:8899 \
              -H 'content-type: application/json' \
              -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"surfnet_setProgramAuthority\",\"params\":[\"${program_id}\",\"${authority}\"]}" \
              | jq -e 'has("result")' >/dev/null
          done
          NO_DNA=1 solana program deploy --use-rpc --url http://127.0.0.1:8899 --program-id 7CChUDvMWCtqWPbtCs74CCAgvuJnyiqpgNYEocNJrno5 --upgrade-authority ~/.config/solana/id.json target/deploy/sra_handler.so
          NO_DNA=1 solana program deploy --use-rpc --url http://127.0.0.1:8899 --program-id 8Fb9Mk2PLcpMjBxd8RWa7TUNMDL2GevMuVEzAbK7YGyU --upgrade-authority ~/.config/solana/id.json target/deploy/sra_across_adapter.so
          NO_DNA=1 solana program deploy --use-rpc --url http://127.0.0.1:8899 --program-id 2bXAvxF3U4FtWAnJtcL9LDnwM7qnErf3y3m6USLRKpRw --upgrade-authority ~/.config/solana/id.json target/deploy/sra_cctp_adapter.so

      - name: Run source Surfpool E2E
        run: NO_DNA=1 cargo test -p sra-handler --test source_e2e_surfpool -- --ignored --nocapture

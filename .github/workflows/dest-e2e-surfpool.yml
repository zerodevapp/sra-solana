name: Destination E2E Surfpool

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "Anchor.toml"
      - "rust-toolchain.toml"
      - "crates/**"
      - "programs/**"
      - "idl/**"
      - "idls/**"
      - "tests/**"
      - ".github/workflows/dest-e2e-surfpool.yml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dest-e2e-surfpool-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: "3.1.11"
  ANCHOR_VERSION: "0.32.1"
  SURFPOOL_VERSION: "v1.2.0"
  NODE_VERSION: "20"
  CARGO_TERM_COLOR: always

jobs:
  dest-e2e-surfpool:
    name: Destination E2E (Surfpool + real Across)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The full Solana dependency tree (debug host builds + SBF toolchain +
      # restored rust-cache) runs the default runner out of disk — the linker
      # dies with SIGBUS mid-build. Drop the large preinstalled toolchains we
      # never use (~20 GB).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: dest-e2e-surfpool
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install yarn deps
        run: yarn install --frozen-lockfile

      - name: Cache Solana + Anchor toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.avm
            ~/.cargo/bin/avm
            ~/.cargo/bin/anchor
          key: toolchain-solana-${{ env.SOLANA_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}-v1

      - name: Install Solana CLI
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"

      - name: Add Solana to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install avm + Anchor
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/coral-xyz/anchor --tag v${ANCHOR_VERSION} avm --force
          avm install ${ANCHOR_VERSION}
          avm use ${ANCHOR_VERSION}

      - name: Generate local keypair
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase --force --silent --outfile ~/.config/solana/id.json

      - name: Install Surfpool
        env:
          VERSION: ${{ env.SURFPOOL_VERSION }}
        run: curl -sL https://run.surfpool.run/ | bash

      - name: Verify tool versions
        run: |
          surfpool --version
          solana --version
          anchor --version
          rustc --version

      - name: Build local programs
        run: NO_DNA=1 anchor build

      - name: Start Surfpool
        run: |
          echo "[surfpool-ci] Starting Surfpool; logs -> /tmp/surfpool.log"
          NO_DNA=1 surfpool start --ci --network mainnet --legacy-anchor-compatibility --airdrop-keypair-path ~/.config/solana/id.json > /tmp/surfpool.log 2>&1 &

      - name: Wait for Surfpool RPC
        run: |
          for i in $(seq 1 60); do
            echo "[surfpool-ci] Waiting for Surfpool RPC (attempt ${i}/60)"
            curl -sf http://127.0.0.1:8899 \
              -H 'content-type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"getHealth","params":[]}' >/dev/null && \
              echo "[surfpool-ci] Surfpool RPC is ready on attempt ${i}/60" && exit 0
            sleep 2
          done
          echo "[surfpool-ci] Timed out waiting for Surfpool RPC; dumping /tmp/surfpool.log"
          cat /tmp/surfpool.log
          exit 1

      - name: Wait for local program auto-deploy
        run: |
          for i in $(seq 1 60); do
            echo "[surfpool-ci] Waiting for local program auto-deploy (attempt ${i}/60) for Gte7LViTnE2UixBF59Xfu2sSqcmHhMNANj42yUkYpkdo and 9xsKH8vdhYbNy9hYEp4e9svbMRjGWpBo2Zbt8NWFnj2D"
            solana account --url http://127.0.0.1:8899 Gte7LViTnE2UixBF59Xfu2sSqcmHhMNANj42yUkYpkdo >/dev/null 2>&1 && \
            solana account --url http://127.0.0.1:8899 9xsKH8vdhYbNy9hYEp4e9svbMRjGWpBo2Zbt8NWFnj2D >/dev/null 2>&1 && \
            echo "[surfpool-ci] Local programs auto-deployed on attempt ${i}/60" && exit 0
            sleep 2
          done
          echo "[surfpool-ci] Timed out waiting for local program auto-deploy; dumping /tmp/surfpool.log"
          cat /tmp/surfpool.log
          exit 1

      - name: Run destination Surfpool E2E
        run: NO_DNA=1 cargo test -p sra-handler --test dest_e2e_surfpool -- --ignored --nocapture

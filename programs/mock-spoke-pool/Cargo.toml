[package]
name = "mock-spoke-pool"
version = "0.1.0"
description = "Minimal Across SVM SpokePool mock for source-flow tests"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_spoke_pool"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.2.0"
anchor-spl = "=1.2.0"
solana-keccak-hasher = "2.2.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

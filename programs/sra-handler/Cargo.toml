[package]
name = "sra-handler"
version = "0.1.0"
description = "SRA Handler — bridge-agnostic, mint-agnostic source + destination handler"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sra_handler"

[features]
default = []
init-if-needed = ["anchor-lang/init-if-needed"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "sra-common/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Build for Solana devnet: selects devnet network constants in sra-common.
devnet = ["sra-common/devnet"]


[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
solana-program = "2.3"
solana-sdk-ids = "2.2.1"
sra-common = { path = "../../crates/sra-common" }

[dev-dependencies]
litesvm = "0.7.1"
litesvm-token = "0.7.1"
solana-sdk = "2.3"
solana-client = "2.3"
solana-system-interface = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
fslock = "0.2"
serde_json = "1.0"
base64 = "0.22"
bincode = "1.3"
sra-across-adapter = { path = "../sra-across-adapter", features = ["no-entrypoint", "test-utils"] }
mock-spoke-pool = { path = "../mock-spoke-pool", features = ["no-entrypoint"] }
mock-swap = { path = "../mock-swap", features = ["no-entrypoint"] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

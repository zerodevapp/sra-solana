[package]
name = "sra-handler"
version = "0.1.0"
description = "SRA Handler — bridge-agnostic, mint-agnostic source + destination handler"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sra_handler"

[features]
default = []
init-if-needed = ["anchor-lang/init-if-needed"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "sra-common/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Build for Solana devnet: selects devnet network constants in sra-common.
devnet = ["sra-common/devnet"]


[dependencies]
anchor-lang = { version = "=1.2.0", features = ["init-if-needed"] }
anchor-spl = "=1.2.0"
solana-program = "3.0.0"
solana-sdk-ids = "3.1.0"
sra-common = { path = "../../crates/sra-common" }

[dev-dependencies]
hex-literal = "1"
libsecp256k1 = "0.6"
litesvm = { version = "=0.16.0", features = ["precompiles"] }
litesvm-token = "=0.16.0"
solana-account = "4.3.0"
solana-address = "~2.6.1"
solana-address-lookup-table-interface = { version = "3.1.0", features = ["bincode", "bytemuck"] }
solana-clock = "3.1.1"
solana-commitment-config = "3.0.0"
solana-compute-budget-interface = "3.0.0"
solana-ed25519-program = "3.0.0"
solana-hash = "4.5.0"
solana-instruction = "3.4.1"
solana-instruction-error = "2.4.0"
solana-keypair = "3.1.2"
solana-message = { version = "4.2.4", features = ["wincode"] }
solana-pubkey = "3.0.0"
solana-rpc-client = "4.2.1"
solana-signature = "3.4.1"
solana-signer = "3.0.0"
solana-system-interface = { version = "3.2.0", features = ["bincode"] }
solana-transaction = { version = "4.1.5", features = ["wincode"] }
solana-transaction-error = "3.3.1"
wincode = "0.5.0"
bs58 = "0.5"
five8_core = { version = "0.1.2", features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
fslock = "0.2"
serde_json = "1.0"
base64 = "0.22"
bincode = "1.3"
sra-across-adapter = { path = "../sra-across-adapter", features = ["no-entrypoint", "test-utils"] }
sra-cctp-adapter = { path = "../sra-cctp-adapter", features = ["no-entrypoint", "test-utils"] }
mock-cctp = { path = "../mock-cctp", features = ["no-entrypoint"] }
mock-spoke-pool = { path = "../mock-spoke-pool", features = ["no-entrypoint"] }
mock-swap = { path = "../mock-swap", features = ["no-entrypoint"] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

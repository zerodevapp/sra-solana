[package]
name = "sra-cctp-adapter"
version = "0.1.0"
description = "SRA CCTP Adapter — Circle CCTP v2 source deposit + destination mint verification"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sra_cctp_adapter"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "sra-common/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
test-utils = []

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"
solana-program = "2.3"
sra-common = { path = "../../crates/sra-common" }

[dev-dependencies]
hex = "0.4"
# Test-side attestation signing only; the on-chain verifier uses the
# secp256k1_recover syscall and a byte-compare high-s check instead.
libsecp256k1 = "0.6"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

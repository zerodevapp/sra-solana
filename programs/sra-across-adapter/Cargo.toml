[package]
name = "sra-across-adapter"
version = "0.1.0"
description = "SRA Across Adapter — Across-specific source deposit + destination fill verification"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sra_across_adapter"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "sra-common/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
test-utils = []
# Build for Solana devnet: selects devnet network constants in sra-common.
devnet = ["sra-common/devnet"]

[dependencies]
anchor-lang = "=1.2.0"
anchor-spl = "=1.2.0"
solana-program = "3.0.0"
sra-common = { path = "../../crates/sra-common" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
